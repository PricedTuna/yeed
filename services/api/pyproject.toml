[project]
name = "yeed-api"
version = "0.1.0"
description = "Yeed REST API running on AWS Lambda."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-lambda-powertools>=3.36,<4",
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[tool.uv]
# The code is deployed as Lambda functions, not published as a Python package.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax for the target Python version
    "B",       # likely bugs
    "S",       # security (bandit)
    "C4",      # comprehensions
    "SIM",     # simplifications
    "RET",     # return statements
    "PT",      # pytest style
    "LOG", "G", # logging
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# pytest checks results with plain assert statements.
"tests/**" = ["S101"]
